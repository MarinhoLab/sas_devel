name: Publish chain

# Umbrella orchestrator for the SAS publishing pipeline. Each step triggers
# the real workflow in its home repository via workflow_dispatch and blocks
# until it finishes, failing the chain on any non-success conclusion:
#   Lint + Build (this repo, same commit) -> deb builder -> docker ->
#   noncommercial deb builder -> sas-full
# Needs one fine-grained PAT per org (Actions: read+write, Contents: read),
# stored as repo secrets: RELEASE_PAT_SMARTARMSTACK for
# SmartArmStack/smart_arm_stack_ROS2 and RELEASE_PAT_MARINHOLAB for
# MarinhoLab/sas_debian_builder_noncommercial and MarinhoLab/sas-full.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which steps of the chain to run
        type: choice
        options:
          - full
          - deb
          - docker
          - noncommercial-and-images
          - images
        default: full
      dry_run:
        description: Verify PAT and workflows without triggering anything
        type: boolean
        default: false

permissions:
  contents: read

# One chain at a time; a second dispatch queues behind the first.
concurrency:
  group: publish-chain
  cancel-in-progress: false

jobs:
  gate_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Show dispatched inputs
        run: echo "inputs = ${{ toJSON(inputs) }}"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wait-for-workflow
        with:
          workflow: lint.yml
          sha: ${{ github.sha }}

  gate_build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wait-for-workflow
        with:
          workflow: sas-build-and-test.yml
          sha: ${{ github.sha }}

  deb:
    needs: [gate_lint, gate_build]
    if: inputs.mode == 'full' || inputs.mode == 'deb'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/watch-workflow
        with:
          repo: SmartArmStack/smart_arm_stack_ROS2
          workflow: sas_debian_builder.yml
          dry_run: ${{ inputs.dry_run }}
          token: ${{ secrets.RELEASE_PAT_SMARTARMSTACK }}

  docker:
    needs: deb
    if: ${{ !cancelled() && (inputs.mode == 'full' || inputs.mode == 'docker') && (needs.deb.result == 'success' || needs.deb.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/watch-workflow
        with:
          repo: SmartArmStack/smart_arm_stack_ROS2
          workflow: docker_build_and_publish.yml
          dry_run: ${{ inputs.dry_run }}
          token: ${{ secrets.RELEASE_PAT_SMARTARMSTACK }}

  noncommercial:
    needs: docker
    if: ${{ !cancelled() && (inputs.mode == 'full' || inputs.mode == 'noncommercial-and-images') && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/watch-workflow
        with:
          repo: MarinhoLab/sas_debian_builder_noncommercial
          workflow: sas_debian_builder.yml
          dry_run: ${{ inputs.dry_run }}
          token: ${{ secrets.RELEASE_PAT_MARINHOLAB }}

  sas_full:
    needs: noncommercial
    if: ${{ !cancelled() && (inputs.mode == 'full' || inputs.mode == 'noncommercial-and-images' || inputs.mode == 'images') && (needs.noncommercial.result == 'success' || needs.noncommercial.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # GitHub Pages deploys lag the deb publish: the image build's apt-get
      # update can catch a stale Packages index listing debs that no longer
      # exist (404). Wait until every listed deb is actually fetchable.
      - name: Wait for the noncommercial Pages repo to settle
        run: |
          base=https://marinholab.github.io/sas_debian_builder_noncommercial/
          for _ in $(seq 1 30); do
              missing=0; total=0
              files="$(curl -fsS "${base}./Packages" | awk '/^Filename: / {print $2}')"
              for f in $files; do
                  total=$((total + 1))
                  code="$(curl -s -o /dev/null -w '%{http_code}' -I "${base}${f}")"
                  [ "$code" = "200" ] || missing=$((missing + 1))
              done
              if [ "$total" -gt 0 ] && [ "$missing" -eq 0 ]; then
                  echo "all $total noncommercial debs are available"
                  exit 0
              fi
              echo "$missing/$total debs missing, retrying in 30s"
              sleep 30
          done
          echo "::error::noncommercial Pages repo did not settle within 15 minutes"
          exit 1

      - uses: actions/checkout@v4
      - uses: ./.github/actions/watch-workflow
        with:
          repo: MarinhoLab/sas-full
          workflow: jazzy.yml
          dry_run: ${{ inputs.dry_run }}
          token: ${{ secrets.RELEASE_PAT_MARINHOLAB }}
