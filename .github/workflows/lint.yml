name: Lint

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ruff
        run: pipx install ruff

      - name: Lint
        run: scripts/lint.sh py

      - name: Lint license headers
        run: scripts/lint.sh headers

  workspace:
    name: Workspace lint (clang-tidy + pyright)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marinholab/gazebo:jazzy
    # GH container jobs default to sh, where `source` does not exist.
    defaults:
      run:
        shell: bash
    # All lint steps are hard gates; the tree is lint-clean (0 findings
    # as of 2026-10-29). Re-introduce step-level continue-on-error only
    # when triaging a new tool or rule.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install lint tools
        run: |
          sudo apt-get update
          # nodejs: the pip pyright needs a node runtime; the distro one
          # avoids nodeenv trying to download node at run time.
          sudo apt-get install -y clang-tidy nodejs libasan8 libubsan1
          # bota-driver/dqrobotics/pyqtdarktheme: the PyPI dependencies the
          # packages declare in their requirements.txt (no rosdep keys; the
          # C++ dqrobotics comes from the SmartArmStack PPA as
          # libdqrobotics-dev), so their imports are not flagged undeclared.
          sudo pip install pyright bota-driver --break-system-packages
          sudo pip install --no-deps dqrobotics --break-system-packages
          sudo pip install pyqtdarktheme==2.1.0 --ignore-requires-python --break-system-packages
          # scipy: needed by the sas_datalogger tests (loadmat round-trip);
          # rosdep skips python3-scipy (universe package, see below).
          sudo pip install scipy --break-system-packages

      # Mirror docker/Dockerfile so the packages actually compile
      # (clang-tidy needs a real compile database and pyright the built
      # pybind11 bindings).
      - name: Install sas_cpp (deb) and sas_py (pip)
        run: |
          sudo apt-get install -y dh-make devscripts
          mkdir -p /tmp/sas_devel/ros2_ws
          cp -a sas_cpp /tmp/sas_devel/sas_cpp
          cd /tmp/sas_devel/sas_cpp
          bash tools/bump-changelog.sh
          dpkg-buildpackage -us -uc -b
          cd ..
          sudo dpkg -i ./libmarinholab-sas-core_*.deb
          cp -a "$GITHUB_WORKSPACE/sas_py" /tmp/sas_devel/sas_py
          cd /tmp/sas_devel/sas_py
          sudo pip install . --break-system-packages

      - name: Install workspace dependencies
        run: |
          sudo rosdep init 2>/dev/null || true
          # Refresh apt lists: the image's can predate newer releases
          # (e.g. ros-jazzy-mavros-msgs) that the explicit installs below
          # pull.
          sudo apt-get update
          # The image's bundled rosdep is old and its cache loader is
          # flaky for released-package keys (it can exit 0 with an index
          # the resolver then cannot see), so treat this as best-effort
          # (most keys resolve, and it must run under sudo like update)
          # and install brov2's heavier ROS deps explicitly below.
          # libmarinholab-sas-core is a non-rosdep key (installed as a .deb
          # above, from the SmartArmStack builder); python3-pyqt6 /
          # python3-pyqtgraph / python3-scipy are Ubuntu universe packages
          # absent from the image's apt sources, and the workspace provides
          # them via pip (requirements.txt / docker/install.sh) anyway.
          sudo rosdep update > /dev/null 2>&1 || true
          sudo rosdep install --from-paths src --ignore-src -r \
            --skip-keys "libmarinholab-sas-core python3-pyqt6 python3-pyqtgraph python3-scipy" \
            || echo "::warning::rosdep install incomplete; relying on explicit installs"
          # brov2's ROS deps that flaky rosdep runs reliably miss.
          sudo apt-get install -y ros-jazzy-mavros-msgs ros-jazzy-realtime-tools

      - name: Build workspace with compile database
        run: |
          # The image's BASH_ENV auto-source trick does not survive the
          # runner's step shell, so source ROS explicitly.
          source /opt/ros/jazzy/setup.bash
          ln -s "$GITHUB_WORKSPACE/src" /tmp/sas_devel/ros2_ws/src
          cd /tmp/sas_devel/ros2_ws
          colcon build --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Scoped to the packages with maintained in-process test suites; the
      # other four (sas_conversions, brov2, coppeliasim, ur_control_template)
      # still carry hardware/bring-up gtests that fail without a robot.
      - name: Test workspace (colcon test)
        run: |
          source /opt/ros/jazzy/setup.bash
          cd /tmp/sas_devel/ros2_ws
          source install/setup.bash
          colcon test --packages-select sas_common sas_robot_driver \
            sas_datalogger sas_force_sensor sas_force_sensor_bota
          # colcon test-result exits 0 when it finds no junit files at
          # all (ament_python writes them under src/, ament_cmake under
          # build/), so a deleted/renamed suite would pass vacuously; pin
          # the gate to the known-good collected-test floor (30 as of
          # 2026-10) so shrinking the suite below that fails the step.
          colcon test-result --verbose | tee /tmp/test_summary.txt
          grep -qE "Summary: ([2-9][0-9]|[0-9]{3,}) tests" \
            /tmp/test_summary.txt || {
              echo "::error::expected at least 22 collected tests"; exit 1; }

      # Second test pass against an ASan+UBSan instrumented build (separate
      # build/install spaces so the Release build above stays the fast gate
      # and the compile database for clang-tidy is untouched). Leak checks
      # stay on; UBSan halts on the first finding so a report fails the
      # test binary instead of only printing it.
      - name: Test workspace (ASan + UBSan)
        run: |
          source /opt/ros/jazzy/setup.bash
          cd /tmp/sas_devel/ros2_ws
          source install/setup.bash
          colcon build --build-base build_san --install-base install_san \
            --packages-select sas_common sas_robot_driver \
              sas_datalogger sas_force_sensor sas_force_sensor_bota \
            --cmake-args -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
              -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          source install_san/setup.bash
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            colcon test --build-base build_san \
              --packages-select sas_common sas_robot_driver \
                sas_datalogger sas_force_sensor sas_force_sensor_bota
          # The default test-result base is build/, which only holds the
          # plain (already-gated) pass — the sanitized junits live under
          # build_san/, so they need their own --test-result-base. The
          # ament_python (bota) junit lands under src/ regardless, so the
          # default-base run is kept to catch its (pure-python) failures.
          # colcon test-result exits 0 on zero files, hence the floors.
          colcon test-result --verbose | tee /tmp/test_summary_san.txt
          colcon test-result --test-result-base build_san --verbose \
            | tee /tmp/test_summary_san_cmake.txt
          grep -qE "Summary: ([2-9][0-9]|[0-9]{3,}) tests" \
            /tmp/test_summary_san.txt || {
              echo "::error::expected at least 22 collected tests (sanitized)"; exit 1; }
          grep -qE "Summary: ([1-9][0-9]|[0-9]{3,}) tests" \
            /tmp/test_summary_san_cmake.txt || {
              echo "::error::sanitized build collected no C++ test results"; exit 1; }

      - name: Lint C++ (clang-tidy)
        env:
          COMPILE_DB: /tmp/sas_devel/ros2_ws/build
        run: scripts/lint.sh cpp

      - name: Type-check Python (pyright)
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/sas_devel/ros2_ws/install/setup.bash
          scripts/lint.sh types

      - name: Lint ROS 2 conventions (murilos_ros2_linter)
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/sas_devel/ros2_ws/install/setup.bash
          scripts/lint.sh ros2
