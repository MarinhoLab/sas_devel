name: Lint

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    # ruff currently reports ~200 style findings (import order, whitespace,
    # pyupgrade) across the submodules; flip this to false once the tree is
    # clean.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint
        run: scripts/lint.sh py

  workspace:
    name: Workspace lint (clang-tidy + pyright)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marinholab/gazebo:jazzy
    # clang-tidy and pyright findings are reported but do not fail the
    # pipeline yet; flip this to false (and consider WarningsAsErrors in
    # .clang-tidy) once the tree is clean.
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install lint tools
        run: |
          sudo apt-get update
          # nodejs: the pip pyright needs a node runtime; the distro one
          # avoids nodeenv trying to download node at run time.
          sudo apt-get install -y clang-tidy nodejs
          # bota-driver/dqrobotics/pyqtdarktheme: the PyPI dependencies the
          # packages declare in their requirements.txt (no rosdep keys; the
          # C++ dqrobotics comes from the SmartArmStack PPA as
          # libdqrobotics-dev), so their imports are not flagged undeclared.
          sudo pip install pyright bota-driver --break-system-packages
          sudo pip install --no-deps dqrobotics --break-system-packages
          sudo pip install pyqtdarktheme==2.1.0 --ignore-requires-python --break-system-packages

      # Mirror docker/Dockerfile so the packages actually compile
      # (clang-tidy needs a real compile database and pyright the built
      # pybind11 bindings).
      - name: Install sas_cpp (deb) and sas_py (pip)
        run: |
          sudo apt-get install -y dh-make devscripts
          mkdir -p /tmp/sas_devel/ros2_ws
          cp -a sas_cpp /tmp/sas_devel/sas_cpp
          cd /tmp/sas_devel/sas_cpp
          bash tools/bump-changelog.sh
          dpkg-buildpackage -us -uc -b
          cd ..
          sudo dpkg -i ./libmarinholab-sas-core_*.deb
          cp -a "$GITHUB_WORKSPACE/sas_py" /tmp/sas_devel/sas_py
          cd /tmp/sas_devel/sas_py
          sudo pip install . --break-system-packages

      - name: Install workspace dependencies
        run: |
          sudo rosdep init 2>/dev/null || true
          # Refresh apt lists: the image's can predate newer releases
          # (e.g. ros-jazzy-mavros-msgs) that the explicit installs below
          # pull.
          sudo apt-get update
          # The image's bundled rosdep is old and its cache loader is
          # flaky for released-package keys (it can exit 0 with an index
          # the resolver then cannot see), so treat this as best-effort
          # (most keys resolve, and it must run under sudo like update)
          # and install brov2's heavier ROS deps explicitly below.
          # libmarinholab-sas-core is a non-rosdep key (installed as a .deb
          # above, from the SmartArmStack builder); python3-pyqt6 /
          # python3-pyqtgraph / python3-scipy are Ubuntu universe packages
          # absent from the image's apt sources, and the workspace provides
          # them via pip (requirements.txt / docker/install.sh) anyway.
          sudo rosdep update > /dev/null 2>&1 || true
          sudo rosdep install --from-paths src --ignore-src -r \
            --skip-keys "libmarinholab-sas-core python3-pyqt6 python3-pyqtgraph python3-scipy" \
            || echo "::warning::rosdep install incomplete; relying on explicit installs"
          # brov2's ROS deps that flaky rosdep runs reliably miss.
          sudo apt-get install -y ros-jazzy-mavros-msgs ros-jazzy-realtime-tools

      - name: Build workspace with compile database
        run: |
          ln -s "$GITHUB_WORKSPACE/src" /tmp/sas_devel/ros2_ws/src
          cd /tmp/sas_devel/ros2_ws
          colcon build --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Lint C++ (clang-tidy)
        env:
          COMPILE_DB: /tmp/sas_devel/ros2_ws/build
        run: scripts/lint.sh cpp

      - name: Type-check Python (pyright)
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/sas_devel/ros2_ws/install/setup.bash
          scripts/lint.sh types

      - name: Lint ROS 2 conventions (murilos_ros2_linter)
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/sas_devel/ros2_ws/install/setup.bash
          scripts/lint.sh ros2
