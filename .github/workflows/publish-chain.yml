name: Publish chain

# Umbrella orchestrator for the SAS publishing pipeline. Each step triggers
# the real workflow in its home repository via workflow_dispatch and blocks
# until it finishes, failing the chain on any non-success conclusion:
#   Lint + Build (this repo, same commit) -> deb builder -> docker ->
#   noncommercial deb builder -> sas-full
# Needs one fine-grained PAT per org (Actions: read+write, Contents: read),
# stored as repo secrets: RELEASE_PAT_SMARTARMSTACK for
# SmartArmStack/smart_arm_stack_ROS2 and RELEASE_PAT_MARINHOLAB for
# MarinhoLab/sas_debian_builder_noncommercial and MarinhoLab/sas-full.

on:
  workflow_dispatch:
    inputs:
      run_deb:
        description: Run the sas deb builder (smart_arm_stack_ROS2)
        type: boolean
        default: true
      run_docker:
        description: Run the docker publish (smart_arm_stack_ROS2)
        type: boolean
        default: true
      run_noncommercial:
        description: Run the noncommercial deb builder (sas_debian_builder_noncommercial)
        type: boolean
        default: true
      run_sas_full:
        description: Run the sas-full image build (sas-full)
        type: boolean
        default: true
      dry_run:
        description: Verify PAT and workflows without triggering anything
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wait-for-workflow
        with:
          workflow: lint.yml
          sha: ${{ github.sha }}

  gate_build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wait-for-workflow
        with:
          workflow: sas-build-and-test.yml
          sha: ${{ github.sha }}

  deb:
    needs: [gate_lint, gate_build]
    if: inputs.run_deb
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/watch-workflow
        with:
          repo: SmartArmStack/smart_arm_stack_ROS2
          workflow: sas_debian_builder.yml
          dry_run: ${{ inputs.dry_run }}
          token: ${{ secrets.RELEASE_PAT_SMARTARMSTACK }}

  docker:
    needs: deb
    if: inputs.run_docker && (needs.deb.result == 'success' || needs.deb.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/watch-workflow
        with:
          repo: SmartArmStack/smart_arm_stack_ROS2
          workflow: docker_build_and_publish.yml
          dry_run: ${{ inputs.dry_run }}
          token: ${{ secrets.RELEASE_PAT_SMARTARMSTACK }}

  noncommercial:
    needs: docker
    if: inputs.run_noncommercial && (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/watch-workflow
        with:
          repo: MarinhoLab/sas_debian_builder_noncommercial
          workflow: sas_debian_builder.yml
          dry_run: ${{ inputs.dry_run }}
          token: ${{ secrets.RELEASE_PAT_MARINHOLAB }}

  sas_full:
    needs: noncommercial
    if: inputs.run_sas_full && (needs.noncommercial.result == 'success' || needs.noncommercial.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/watch-workflow
        with:
          repo: MarinhoLab/sas-full
          workflow: jazzy.yml
          dry_run: ${{ inputs.dry_run }}
          token: ${{ secrets.RELEASE_PAT_MARINHOLAB }}
